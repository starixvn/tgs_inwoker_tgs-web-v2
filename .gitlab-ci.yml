stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  tags:
    - local-build
  script:
    - |
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
      nvm install 20
      nvm use 20
      npm install
      npm run build
      cp -a dist/. public/

      imageTag=lobby:`date +%Y-%m%d-%H%M`
      docker build . -t pgtgs/$imageTag
      docker image ls
      docker push pgtgs/$imageTag

deploy-dev:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
    - dev
    - kubernetes
    - deploy
  needs:
    - build-job
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-staging:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: staing
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
    - kubernetes
    - deploy
  needs:
    - build-job
    - deploy-dev
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-prod:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
    - kubernetes
    - deploy
  needs:
    - build-job
    - deploy-staging
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace