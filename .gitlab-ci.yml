stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod
variables:
  imageRepository: pgtgs
build-job:       # This job runs in the build stage, which runs first.
  stage: build
  tags:
    - local-build
  artifacts:
    paths:
      - image.txt
  script:
    - |
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
      nvm install 20
      nvm use 20
      npm install
      npm run build
      cp -a dist/. public/

      imageTag=lobby:`date +%Y-%m%d-%H%M`
      docker build . -t $imageRepository/$imageTag
      docker image ls
      echo $imageTag > image.txt
      docker push $imageRepository/$imageTag

deploy-dev:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
    - dev
  needs:
    - job: build-job
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - | 
      if [[ $domain != "" && $brand != "" ]]; then 
        export tag=$(cat image.txt)
        echo "image=$image"
        echo "tag=$tag"

        envsubst < ./deployment/values-${namespace}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${namespace}
        helm template $brand deployment -f values.yaml -n ${namespace} | kubectl apply -f - 
      else 
        echo "test"
      fi

deploy-staging:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: staing
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
  needs:
    - job: deploy-dev
      artifacts: true
    - build-job
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace

deploy-prod:
  image: 
    name: pgtgs/tgs-backend-deploy:latest  
  variables:
    namespace: prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
  needs:
    - job: build-job
      artifacts: true
    - deploy-staging
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace