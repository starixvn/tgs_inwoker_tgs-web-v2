stages:
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  imageRepository: pgtgs/lobby-v2

build-job:
  stage: build
  tags:
    - local-build
  artifacts:
    paths:
      - image.txt
  script:
    - |
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
      nvm install 20
      nvm use 20
      npm install
      npm run build
      cp -a dist/. public/
      
      imageTag=$(date +%Y-%m%d-%H%M)
      docker build . -t $imageRepository:$imageTag
      echo $imageTag > image.txt
      docker push $imageRepository:$imageTag

# Reusable deployment script
.deploy-job-script: &deploy-job-script
  script:
    - |
      export tag=$(cat image.txt)
      export image=$imageRepository
      if [[ $env == $namespace && $domain != "" && $brand != "" ]]; then
        echo "image=$image"
        echo "tag=$tag"
        echo "brand=$brand"
        echo "domain=$domain"
        echo "token=$token"

        envsubst < ./deployment/values-${namespace}.yaml > values.yaml
        helm template $brand deployment -f values.yaml -n ${namespace}
        helm template $brand deployment -f values.yaml -n ${namespace} | kubectl apply -f -

        key="${env}_v2"
        echo "key=${key}"

        _value=$(curl --header "PRIVATE-TOKEN: $gitlab_token" "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/$key" | jq -r ".value")
        echo "value=$_value"

        if [[ "$_value" == "null" ]]; then
          url="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables?key=${key}&value=${brand}&environment_scope=${tgs_env}&protected=true"
          curl --request POST --header "PRIVATE-TOKEN: $gitlab_token" "$url"
          echo "variable $key created"
        elif [[ ! ${_value} == "$brand" ]]; then
          new_value="${_value},${brand}"
          url="https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/${key}?value=${new_value}"
          curl --request PUT --header "PRIVATE-TOKEN: $gitlab_token" "$url"
          echo "variable $key updated"
        fi

        if [[ ! "${tgs_env}" == "prod" ]]; then
          url="https://api.cloudflare.com/client/v4/zones/c6c8be8e9c04948f486101b1b994c09c/dns_records"
          responseId=$(curl -X GET "${url}?name=$domain" -H "Authorization: Bearer $cf_token" -H "Content-Type: application/json" | jq -r '.result | .[] | select(.name == "$domain").id')
          
          if [[ "${responseId}" == "" ]]; then
            result=$(curl -X POST "${url}" -H "Authorization: Bearer $cf_token" -H "Content-Type: application/json" --data '{"type":"CNAME","name":"'$domain'","content":"'${env}'-entry.rpgp.cc","proxied":true}')
            echo "create result: ${result}"
          fi
        else
          response=$(curl -X GET "https://api.cloudflare.com/client/v4/zones?per_page=1000&name=$domain" -H "Authorization: Bearer $token" -H "Content-Type: application/json")
          zoneid=$(echo ${response} | jq -r '.result[0].id')
          echo "zoneid=$zoneid"
          response_create_rule=$(curl -X POST "https://api.cloudflare.com/client/v4/zones/${zoneid}/firewall/rules" -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data '[{"action": "block","paused": false,"description": "Block Taiwan","filter":{"expression": "(ip.geoip.country in {\"TW\"} and not ip.src in {125.227.69.109 125.227.69.112})","paused": false }}]')
          echo "create result:"
          echo ${response_create_rule} | jq
        fi
      elif [[ $namespace == "" ]]; then
        lobbies="${env}_v2"
        IFS=',' read -ra array <<< "${!lobbies}"
        image="$imageRepository:$tag"
        for lb in "${array[@]}"; do
          kubectl set image deployment/$lb $lb=${image} -n ${env}
        done
      fi

deploy-dev:
  image: pgtgs/tgs-backend-deploy:latest
  variables:
    env: dev
  environment:
    name: dev
  stage: deploy-dev
  tags:
    - dev
  needs:
    - job: build-job
      artifacts: true
  only:
    - main
  when: on_success
  <<: *deploy-job-script

deploy-staging:
  image: pgtgs/tgs-backend-deploy:latest
  variables:
    env: staging
  environment:
    name: staging
  stage: deploy-staging
  tags:
    - staging
  needs:
    - job: deploy-dev
      artifacts: true
    - build-job
  only:
    - main
  when: manual
  <<: *deploy-job-script

deploy-prod:
  image: pgtgs/tgs-backend-deploy:latest
  variables:
    env: prod
  environment:
    name: prod
  stage: deploy-prod
  tags:
    - prod
  needs:
    - job: build-job
      artifacts: true
    - deploy-staging
  only:
    - main
  when: manual
  <<: *deploy-job-script